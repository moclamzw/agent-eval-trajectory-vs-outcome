[project]
name = "agent-eval-trajectory-vs-outcome"
version = "0.1.0"
description = "Trajectory grading vs final-outcome grading on the same agent runs, showing the disagreement rate."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
